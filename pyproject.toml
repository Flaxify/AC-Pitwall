[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "Automated, verified Assetto Corsa mod fetcher."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20",
]

[project.scripts]
pitwall = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

